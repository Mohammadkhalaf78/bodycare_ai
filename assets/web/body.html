<!doctype html>
<html>
<head>
  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body { margin:0; }
    model-viewer {
      width: 100%;
      height: 100vh;
      background: white;
    }

    button.hotspot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: none;
      background: red;
      cursor: pointer;
    }
  </style>
</head>

<body>

<model-viewer id="mv"
  src="model_v8.glb"
  camera-controls
  auto-rotate>

  <!-- Hotspot الرأس -->
  <button class="hotspot"
    slot="hotspot-head"
    data-position="0m 1.65m 0m"
    title="Head">
  </button>

  <!-- Hotspot الصدر -->
  <button class="hotspot"
    slot="hotspot-chest"
    data-position="0m 1.30m 0.05m"
    title="Chest">
  </button>

</model-viewer>

<script>
  document.querySelectorAll(".hotspot").forEach(btn => {
    btn.addEventListener("click", () => {
      let name = btn.getAttribute("title");
      ModelBridge.postMessage(name);
    });
  });
</script>

</body>
</html>
